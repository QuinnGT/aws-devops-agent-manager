version: 2
updates:
  # pnpm projects use the "npm" ecosystem. Dependabot reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the Node.js major the app runs on (24, in CI and the Containerfile).
      # Move it with the image and CI by hand, like library/node below.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Keeps the commit SHAs in .github/workflows up to date, and the version comment next to each one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The Docker updater reads files named Dockerfile or Containerfile in the directory
  # (docker/lib/dependabot/docker/file_fetcher.rb in dependabot-core).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image runs the same Node.js major version as CI (24). Move both together, by hand.
      # Dependabot names the image library/node because the Containerfile uses the full docker.io/library/node path.
      - dependency-name: library/node
        update-types: [version-update:semver-major]
