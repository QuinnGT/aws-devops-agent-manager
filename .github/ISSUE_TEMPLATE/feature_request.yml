name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project manages an AWS DevOps Agent Space from outside the console. If the AWS DevOps Agent service already offers what you need, use the service.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Describe the behavior you expect. A sketch of the screen or command is enough.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this.
