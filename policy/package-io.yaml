# Package import and export. Upload size and file caps are in limits.yaml
# (packageRead); the path-to-asset mappings are the layouts in
# package-layouts.yaml.

uploads:
  # Uploaded packages are stored under DAM_DATA_DIR/package-imports/<id>.zip
  # and deleted this many days after the upload. The import record and its
  # mapping results are kept; only the file goes.
  retentionDays: 30
  # Cron (UTC) for the job that deletes expired uploads.
  expireCron: "29 3 * * *"

import:
  # Title of the plan created from an import.
  # Placeholders: {packageName} {fileName} {spaceAlias}
  planTitle: "Import {fileName}"
  # Refuse to create a plan while the package has validation errors.
  blockPlanOnErrors: true
  # Imports per page on the import list.
  listPageSize: 50

export:
  # Package name, which is also the zip's top folder and file name.
  # Placeholders: {spaceAlias} {ref} {layout}. {ref} is the release name for
  # a release tag, otherwise the short commit hash (HEAD included).
  packageName: "{spaceAlias}-{ref}"
  # Recent commits offered as export points, besides HEAD and the release tags.
  recentCommits: 20
  # Parallel git reads when reading a space's assets at a commit.
  gitReadConcurrency: 4
  # true: refuse the download while the package fails its checks. false:
  # download every asset anyway (the space already holds each one, so the
  # errors are layout conventions, for example a shared section a live space
  # can't supply) and list the errors in the notes file below.
  blockOnFailedChecks: false
  notes:
    # The notes file's package path; keep it a non-asset path of the layouts. null: no file.
    path: reference/EXPORT-NOTES.md
    title: "# Export notes"
    # Placeholders: {ref} {layout}
    intro: "The space's assets at {ref} don't pass every package check in the {layout} layout. The space already holds each asset, so every one is in this zip as it is."
    none: "No asset was left out."
    remaining: "## Package check errors"
